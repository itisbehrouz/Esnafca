name: esnafca
description: "Türkiye'nin küçük esnaf ve yerel zanaatkârlarını buluşturan komisyonsuz mobil platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  lucide_icons: ^0.257.0
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  url_launcher: ^6.2.5
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
